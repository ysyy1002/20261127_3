{% extends "base.html" %}
{% block content %}
<h1>회원가입</h1>

{% if error %}<p class="error">{{ error }}</p>{% endif %}

<!-- 버튼을 누르면 POST /signup 으로 입력값이 전송됨 -->
<form action="/signup" method="post">
  <input name="username" placeholder="아이디" required>
  <input name="name" placeholder="이름" required>
  <input name="password" type="password" placeholder="비밀번호 (4자 이상)" required>
  <input name="password2" type="password" placeholder="비밀번호 확인" required>
  <button>가입하기</button>
</form>
{% endblock %}
